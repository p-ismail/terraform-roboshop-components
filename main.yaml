resource "aws_instance" "main" {
  ami           = local.ami_id
  instance_type = "t3.micro"
  subnet_id = local.private_subnet_ids
  vpc_security_group_ids = [local.sg_id]
 

  tags = merge(
    {
        Name = "${var.project}-${var.environment}-${component}"
    },
    local.common_tags
  )
}

#here after the launching catalogue we are connecting to the mongodb host 
resource "terraform_data" "main" {
  triggers_replace = [
    aws_instance.main.id #if the catalogue instance id was changed this trigger and reconfigure
  ]

  connection {
    type        = "ssh"
    user        = "ec2-user"#authentication
    password = "DevOps321"
    host        = aws_instance.main.private_ip
  }

   #File provisioner block to copy a local configuration file
  provisioner "file" {
    source      = "bootstrap.sh"        # Path on your local machine
    destination = "/tmp/bootstrap.sh"         # Path on the remote machine
  }


  provisioner "remote-exec" {
    inline = [ #inline means we exceute multiple cmds
    "chmod +x /tmp/bootstrap.sh",
    "sudo sh /tmp/bootstrap.sh ${var.component} ${var.environment} ${var.app_version}"

     ]
  }
}
#if we want to  take AMI first we need to stop the instances it's fro upgradation
resource "aws_ec2_instance_state" "main" {
  instance_id = aws_instance.main.id
  state       = "stopped" # Change to "running" to start it back up
  depends_on = [terraform_data.main ] #after creation only we can able to stop
}

resource "aws_ami_from_instance" "main" {
  name               = "${var.project}-${var.environment}-${var.component}"
  source_instance_id = aws_instance.main.id
  depends_on = [ aws_ec2_instance_state.main ] #after instances stopped we can create AMI
  tags = merge(
    {
        Name = "${var.project}-${var.environment}-${var.component}"
    },
    local.common_tags
  )
}

#creating the target group  
resource "aws_lb_target_group" "main" {
  name     = "${var.project}-${var.environment}-${var.component}"
  port     = var.port_number
  protocol = "HTTP"
  vpc_id   = local.vpc_id
  deregistration_delay = 60
  health_check {
    healthy_threshold =2 #min 2 requests get to success
    interval = 10 #every 10 sec
    matcher = "200-299" #healthy return code
    path = local.health_check_path
    port = local.port_number
    protocol = "HTTP"
    timeout = 2
    unhealthy_threshold = 3
  }
}

#creating the lauch template

resource "aws_launch_template" "main" {
  name = "${var.project}-${var.environment}-${var.component}"
  image_id = aws_ami_from_instance.main.id

  #once autoscalling sees less traffic,it will terminate the instance
  instance_initiated_shutdown_behavior = "terminate"
  instance_type = "t3.micro"
  vpc_security_group_ids = [local.sg_id]

  #each time we apply terraform this version will update as default
  update_default_version = true

  #tags for instances created by lauch template through autoscalling
  tag_specifications {
    resource_type = "instance"

    tags = merge(
    {
      Name = "${var.project}-${var.environment}-${var.component}"
    },
    local.common_tags
    )
  }
    #tags for volumes created by instances
   tag_specifications {
    resource_type = "volume"

    tags = merge(
    {
      Name = "${var.project}-${var.environment}-${var.component}"
    },
    local.common_tags
    )
  }
  #tags for the launch template
  tags = merge(
    {
      Name = "${var.project}-${var.environment}-${var.component}"
    },
    local.common_tags
    )
}

resource "aws_autoscaling_group" "main" {
  name                      = "${var.project}-${var.environment}-${var.component}"
  max_size                  = 10
  min_size                  = 1
  health_check_grace_period = 120
  health_check_type         = "ELB"
  desired_capacity          = 1
  force_delete              = false

   launch_template {
                id      = aws_launch_template.main.id
                version = "$Latest"
  }

  vpc_zone_identifier       = [local.private_subnet_ids]
  target_group_arns = [ aws_lb_target_group.main.arn ]

  instance_refresh {
    strategy = "Rolling"
    preferences {
      min_healthy_percentage = 50
    }
    triggers = ["launch_template"] #if launch template was updrade to new version ,autoscalling will refresh
  }

  dynamic "tag" {
    for_each = merge(
        {
            Name = "${var.project}-${var.environment}-${var.component}"
        },
        local.common_tags
    )
   content {
        key                 = tag.key
        value               = tag.value
        propagate_at_launch = true
   } 
  }

 #within 15 min autoscalling should be successfull
  timeouts {
    delete = "15m"
  }
}

#Auto scalling policy

resource "aws_autoscaling_policy" "main" {
  autoscaling_group_name = aws_autoscaling_group.main.name
  name                   = "${var.project}-${var.environment}-${var.component}"
  policy_type            = "TargetTrackingScaling"
  estimated_instance_warmup = 120

  target_tracking_configuration {
    predefined_metric_specification {
      predefined_metric_type = "ASGAverageCPUUtilization"
    }

    target_value = 70.0
  }
  
}

resource "aws_lb_listener_rule" "main" {
  listener_arn = local.alb_listener_arn
  priority     = var.rule_priority

  action {
    type             = "forward"
    target_group_arn = aws_lb_target_group.main.arn
  }

  condition {
    host_header {
      values = [local.host_header]
    }
  }
}

resource "terraform_data" "main_delete" {
  triggers_replace = [
    aws_instance.main.id #if the catalogue instance id was changed this trigger and reconfigure
  ]
  depends_on = [ aws_autoscaling_policy.main ]

  #it executes in bastion
  provisioner "local-exec" {
   command = "aws ec2 terminate-instances --instance-ids ${aws_instance.main.id} "
  }
}






